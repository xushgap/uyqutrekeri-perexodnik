    <!-- ==========================================
         JAVASCRIPT: PROCEDURAL PURPLE MOON & CURSOR PARALLAX
    =========================================== -->
    <script>
        /**
         * 1. PROCEDURAL HIGH-RESOLUTION PURPLE/LAVENDER MOON RENDERER
         * Generates a realistic cratered lunar texture matching the purple moon in the reference image,
         * including ray craters (Tycho/Copernicus style), lunar maria (darker purple seas), and fine grain.
         */
        function renderDetailedPurpleMoon() {
            const canvas = document.getElementById('moonCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = w / 2;

            ctx.clearRect(0, 0, w, h);

            // Save clipping region to circle
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            // A. Base Spherical Lavender-Purple Gradient
            const baseGrad = ctx.createRadialGradient(cx * 0.92, cy * 0.65, radius * 0.05, cx, cy, radius);
            baseGrad.addColorStop(0, '#ded0f8');    // Bright lavender highlight near upper-center
            baseGrad.addColorStop(0.35, '#bfa7ec'); // Soft medium purple-lavender
            baseGrad.addColorStop(0.72, '#9982cc'); // Deeper lunar purple
            baseGrad.addColorStop(0.93, '#725ba6'); // Limb shading
            baseGrad.addColorStop(1, '#523f80');    // Outer edge depth
            ctx.fillStyle = baseGrad;
            ctx.fillRect(0, 0, w, h);

            // Seeded pseudo-random generator for consistent moon features matching the screenshot layout
            let seed = 4219;
            function rand() {
                seed = (seed * 16807) % 2147483647;
                return (seed - 1) / 2147483646;
            }

            // B. Lunar Maria (Darker purple-slate irregular patches like in the lower-left and middle of the screenshot)
            const mariaPatches = [
                { x: 0.36, y: 0.36, r: 0.14, alpha: 0.32, color: '#4c3e6b' },
                { x: 0.43, y: 0.42, r: 0.11, alpha: 0.38, color: '#3f3259' },
                { x: 0.34, y: 0.56, r: 0.16, alpha: 0.42, color: '#42365c' },
                { x: 0.54, y: 0.53, r: 0.15, alpha: 0.36, color: '#463963' },
                { x: 0.48, y: 0.62, r: 0.14, alpha: 0.35, color: '#3d3157' },
                { x: 0.68, y: 0.42, r: 0.13, alpha: 0.22, color: '#5b4882' },
                { x: 0.25, y: 0.48, r: 0.12, alpha: 0.28, color: '#4c3e6b' }
            ];

            mariaPatches.forEach(m => {
                for (let i = 0; i < 18; i++) {
                    const angle = rand() * Math.PI * 2;
                    const dist = rand() * m.r * w * 0.7;
                    const px = m.x * w + Math.cos(angle) * dist;
                    const py = m.y * h + Math.sin(angle) * dist;
                    const pr = (0.3 + rand() * 0.7) * m.r * w * 0.65;

                    const g = ctx.createRadialGradient(px, py, pr * 0.1, px, py, pr);
                    g.addColorStop(0, `rgba(54, 43, 78, ${m.alpha})`);
                    g.addColorStop(0.6, `rgba(74, 59, 107, ${m.alpha * 0.5})`);
                    g.addColorStop(1, 'rgba(120, 100, 165, 0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(px, py, pr, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // C. Bright Ejecta Ray Systems (Matching the bright white-lavender starbursts at top-center & middle-right)
            const rayCenters = [
                { x: 0.50, y: 0.11, r: 22, rays: 26, len: 290, alpha: 0.45 }, // Bright top-center crater rays
                { x: 0.65, y: 0.39, r: 16, rays: 20, len: 230, alpha: 0.35 }, // Right-middle bright ray crater
                { x: 0.58, y: 0.52, r: 14, rays: 16, len: 180, alpha: 0.30 }
            ];

            rayCenters.forEach(rc => {
                const rx = rc.x * w;
                const ry = rc.y * h;

                // Draw radiating ejecta streaks
                ctx.save();
                for (let i = 0; i < rc.rays; i++) {
                    const angle = (i / rc.rays) * Math.PI * 2 + (rand() - 0.5) * 0.25;
                    const rayLen = rc.len * (0.4 + rand() * 0.8);
                    const grad = ctx.createLinearGradient(rx, ry, rx + Math.cos(angle) * rayLen, ry + Math.sin(angle) * rayLen);
                    grad.addColorStop(0, `rgba(250, 244, 255, ${rc.alpha})`);
                    grad.addColorStop(0.4, `rgba(229, 212, 255, ${rc.alpha * 0.45})`);
                    grad.addColorStop(1, 'rgba(200, 180, 240, 0)');

                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 2 + rand() * 6;
                    ctx.beginPath();
                    ctx.moveTo(rx, ry);
                    ctx.lineTo(rx + Math.cos(angle) * rayLen, ry + Math.sin(angle) * rayLen);
                    ctx.stroke();
                }

                // Bright crater halo
                const halo = ctx.createRadialGradient(rx, ry, 2, rx, ry, rc.r * 2.4);
                halo.addColorStop(0, 'rgba(255, 252, 255, 0.85)');
                halo.addColorStop(0.5, 'rgba(232, 215, 255, 0.35)');
                halo.addColorStop(1, 'rgba(200, 175, 245, 0)');
                ctx.fillStyle = halo;
                ctx.beginPath();
                ctx.arc(rx, ry, rc.r * 2.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // D. Hundreds of Detailed Craters (Large, Medium, Micro) with 3D rim highlights & inner shadows
            const totalCraters = 420;
            for (let i = 0; i < totalCraters; i++) {
                const cxPos = rand() * w;
                const cyPos = rand() * h;
                // Keep within moon circle
                const distFromCenter = Math.hypot(cxPos - cx, cyPos - cy);
                if (distFromCenter > radius * 0.98) continue;

                // Size distribution: mostly small/medium, some prominent craters
                const sizeFactor = Math.pow(rand(), 3.2);
                const cRadius = 2.5 + sizeFactor * 34;

                // Outer bright rim (lit from top-right)
                ctx.beginPath();
                ctx.arc(cxPos, cyPos, cRadius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(238, 226, 255, ${0.12 + rand() * 0.18})`;
                ctx.fill();

                // Inner crater floor shadow (offset slightly top-left)
                const floorGrad = ctx.createRadialGradient(
                    cxPos - cRadius * 0.22,
                    cyPos - cRadius * 0.22,
                    cRadius * 0.1,
                    cxPos,
                    cyPos,
                    cRadius * 0.92
                );

                const isDarkFloor = rand() > 0.65;
                if (isDarkFloor) {
                    floorGrad.addColorStop(0, 'rgba(58, 46, 84, 0.78)');
                    floorGrad.addColorStop(0.7, 'rgba(88, 70, 126, 0.55)');
                    floorGrad.addColorStop(1, 'rgba(175, 152, 224, 0.15)');
                } else {
                    floorGrad.addColorStop(0, 'rgba(92, 74, 134, 0.65)');
                    floorGrad.addColorStop(0.75, 'rgba(138, 114, 190, 0.4)');
                    floorGrad.addColorStop(1, 'rgba(220, 202, 252, 0.2)');
                }

                ctx.beginPath();
                ctx.arc(cxPos, cyPos, cRadius * 0.88, 0, Math.PI * 2);
                ctx.fillStyle = floorGrad;
                ctx.fill();

                // Sharp sunlit lower-right crater rim
                ctx.beginPath();
                ctx.arc(cxPos + cRadius * 0.08, cyPos + cRadius * 0.08, cRadius * 0.88, -0.2, Math.PI * 0.75);
                ctx.strokeStyle = `rgba(248, 240, 255, ${0.22 + rand() * 0.3})`;
                ctx.lineWidth = Math.max(1, cRadius * 0.11);
                ctx.stroke();
            }

            // E. Fine Lunar Regolith Grain / Surface Texture
            for (let i = 0; i < 3500; i++) {
                const gx = rand() * w;
                const gy = rand() * h;
                const isLight = rand() > 0.5;
                ctx.fillStyle = isLight ? 'rgba(245, 238, 255, 0.12)' : 'rgba(52, 40, 79, 0.14)';
                ctx.fillRect(gx, gy, 1.8, 1.8);
            }

            // F. Spherical 3D Vignette around the Moon's edge
            const limbShadow = ctx.createRadialGradient(cx, cy * 0.88, radius * 0.65, cx, cy, radius);
            limbShadow.addColorStop(0, 'rgba(0,0,0,0)');
            limbShadow.addColorStop(0.82, 'rgba(42, 30, 68, 0.18)');
            limbShadow.addColorStop(1, 'rgba(22, 16, 38, 0.55)');
            ctx.fillStyle = limbShadow;
            ctx.fillRect(0, 0, w, h);

            ctx.restore();
        }

        /**
         * 2. INTERACTIVE CURSOR & WHEEL ANIMATION ENGINE
         * Moves the Moon smoothly up & down when the user moves the cursor vertically (and tilts horizontally),
         * plus responds to mouse wheel scrolling and touch movement on mobile.
         */
        const moonEl = document.getElementById('interactive-moon');
        const moonOrbitArc = document.getElementById('moon-orbit-arc');
        const parallaxStars = document.getElementById('parallax-stars');
        const parallaxOrbits = document.getElementById('parallax-orbits');
        const parallaxHills = document.getElementById('parallax-hills');

        let targetMouseX = 0; // Normalized -1 to 1 (left to right)
        let targetMouseY = 0; // Normalized -1 to 1 (top to bottom)
        let currentMouseX = 0;
        let currentMouseY = 0;
        let wheelOffsetY = 0;
        let currentWheelY = 0;
        let clock = 0;

        // Track Mouse Cursor Position (Up/Down and Left/Right)
        window.addEventListener('mousemove', (e) => {
            targetMouseX = (e.clientX / window.innerWidth) * 2 - 1;
            targetMouseY = (e.clientY / window.innerHeight) * 2 - 1;
        });

        // Track Mouse Wheel for extra vertical moon movement even on a locked 100vh screen
        window.addEventListener('wheel', (e) => {
            wheelOffsetY = Math.max(-70, Math.min(70, wheelOffsetY + e.deltaY * 0.12));
        }, { passive: true });

        // Track Touch Move on Mobile/Tablet so Moon also follows finger up and down
        window.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches.length > 0) {
                const touch = e.touches[0];
                targetMouseX = (touch.clientX / window.innerWidth) * 2 - 1;
                targetMouseY = (touch.clientY / window.innerHeight) * 2 - 1;
            }
        }, { passive: true });

        // Smooth 60FPS Animation Loop (Lerp physics)
        function animateScene() {
            clock += 0.022;

            // Smooth interpolation (damping) towards target cursor and wheel positions
            currentMouseX += (targetMouseX - currentMouseX) * 0.075;
            currentMouseY += (targetMouseY - currentMouseY) * 0.075;
            
            // Gradually relax wheel offset back toward 0 while keeping smooth response
            wheelOffsetY *= 0.96;
            currentWheelY += (wheelOffsetY - currentWheelY) * 0.08;

            // Gentle idle breathing motion so the moon feels alive even when cursor stops
            const idleWaveY = Math.sin(clock) * 12;
            const idleWaveRotate = Math.cos(clock * 0.7) * 1.4;

            // Calculate vertical & horizontal displacement for the Moon
            // Moving cursor UP/DOWN moves the moon smoothly UP/DOWN
            const moonMoveY = (currentMouseY * 68) + currentWheelY + idleWaveY;
            const moonMoveX = (currentMouseX * 28);
            const moonRotate = (currentMouseX * 5.5) + (currentMouseY * 2.5) + idleWaveRotate;

            if (moonEl) {
                moonEl.style.transform = `translate3d(${moonMoveX.toFixed(2)}px, ${moonMoveY.toFixed(2)}px, 0) rotate(${moonRotate.toFixed(2)}deg)`;
            }

            // Counter-rotate orbital arc slightly for depth
            if (moonOrbitArc) {
                const arcY = currentMouseY * -14;
                const arcRot = -currentMouseX * 3.2;
                moonOrbitArc.style.transform = `translate3d(0, ${arcY.toFixed(2)}px, 0) rotate(${arcRot.toFixed(2)}deg)`;
            }

            // Multi-layer Starfield & Orbital Rings Parallax
            if (parallaxStars) {
                const starX = -currentMouseX * 22;
                const starY = -currentMouseY * 28 - (currentWheelY * 0.25);
                parallaxStars.style.transform = `translate3d(${starX.toFixed(2)}px, ${starY.toFixed(2)}px, 0)`;
            }

            if (parallaxOrbits) {
                const orbitX = -currentMouseX * 14;
                const orbitY = -currentMouseY * 18 - (currentWheelY * 0.15);
                parallaxOrbits.style.transform = `translate3d(${orbitX.toFixed(2)}px, ${orbitY.toFixed(2)}px, 0)`;
            }

            if (parallaxHills) {
                const hillX = -currentMouseX * 10;
                const hillY = currentMouseY * 12;
                parallaxHills.style.transform = `translate3d(${hillX.toFixed(2)}px, ${hillY.toFixed(2)}px, 0)`;
            }

            requestAnimationFrame(animateScene);
        }

        // Initialize on window load
        window.onload = function () {
            renderDetailedPurpleMoon();
            animateScene();
        };
    </script>
</body>
</html>
